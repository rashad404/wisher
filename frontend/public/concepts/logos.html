<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Manrope:wght@600;800&display=block" rel="stylesheet">
<style>
body{margin:0;font-family:Manrope,sans-serif;background:#f4f1f2;padding:28px}
.row{display:grid;grid-template-columns:40px 90px 120px 1fr;align-items:center;gap:22px;background:#fff;border-radius:16px;padding:18px 22px;margin-bottom:14px}
.lbl{font-weight:800;font-size:26px;color:#a3122f}
.bar{background:#a3122f;border-radius:12px;height:76px;display:flex;align-items:center;padding:0 22px;gap:10px;color:#fff}
.word{font-family:Fraunces,serif;font-weight:800;font-size:32px;letter-spacing:-.02em}
.word small{font-family:Manrope;font-size:15px;font-weight:600;opacity:.75;margin-left:2px}
.fav{display:flex;gap:10px;align-items:center}
svg text{font-family:Fraunces,serif;font-weight:800}
</style></head><body>
<!-- A monogram -->
<div class="row"><div class="lbl">A</div>
 <div class="fav"><svg width="16" height="16" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#a3122f"/><text x="32" y="47" text-anchor="middle" font-size="46" fill="#fff">w</text></svg><svg width="64" height="64" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#a3122f"/><text x="32" y="47" text-anchor="middle" font-size="46" fill="#fff">w</text></svg></div>
 <div style="font-size:13px;color:#5f5357">Monogram: bold serif "w" in a red tile</div>
 <div class="bar"><svg width="40" height="40" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#fff"/><text x="32" y="47" text-anchor="middle" font-size="46" fill="#a3122f">w</text></svg><span class="word">wisher<small>.az</small></span></div></div>
<!-- B gift tag -->
<div class="row"><div class="lbl">B</div>
 <div class="fav"><svg width="16" height="16" viewBox="0 0 64 64"><path d="M20 6h34a6 6 0 016 6v40a6 6 0 01-6 6H20L4 32z" fill="#a3122f"/><circle cx="16" cy="32" r="4" fill="#fff"/><text x="38" y="44" text-anchor="middle" font-size="34" fill="#fff">w</text></svg><svg width="64" height="64" viewBox="0 0 64 64"><path d="M20 6h34a6 6 0 016 6v40a6 6 0 01-6 6H20L4 32z" fill="#a3122f"/><circle cx="16" cy="32" r="4" fill="#fff"/><text x="38" y="44" text-anchor="middle" font-size="34" fill="#fff">w</text></svg></div>
 <div style="font-size:13px;color:#5f5357">Gift tag with "w": gifts and labels with a name</div>
 <div class="bar"><svg width="44" height="44" viewBox="0 0 64 64"><path d="M20 6h34a6 6 0 016 6v40a6 6 0 01-6 6H20L4 32z" fill="#fff"/><circle cx="16" cy="32" r="4" fill="#a3122f"/><text x="38" y="44" text-anchor="middle" font-size="34" fill="#a3122f">w</text></svg><span class="word">wisher<small>.az</small></span></div></div>
<!-- C speech bubble heart -->
<div class="row"><div class="lbl">C</div>
 <div class="fav"><svg width="16" height="16" viewBox="0 0 64 64"><path d="M32 6c14.4 0 26 10 26 23s-11.6 23-26 23c-3 0-5.8-.4-8.4-1.2L10 58l3.4-11.4C8.8 42.5 6 36.1 6 29 6 16 17.6 6 32 6z" fill="#a3122f"/><path d="M32 40s-11-6.4-11-13.2c0-3.5 2.7-6 6-6 2.3 0 4 1.3 5 3 1-1.7 2.7-3 5-3 3.3 0 6 2.5 6 6C43 33.6 32 40 32 40z" fill="#fff"/></svg><svg width="64" height="64" viewBox="0 0 64 64"><path d="M32 6c14.4 0 26 10 26 23s-11.6 23-26 23c-3 0-5.8-.4-8.4-1.2L10 58l3.4-11.4C8.8 42.5 6 36.1 6 29 6 16 17.6 6 32 6z" fill="#a3122f"/><path d="M32 40s-11-6.4-11-13.2c0-3.5 2.7-6 6-6 2.3 0 4 1.3 5 3 1-1.7 2.7-3 5-3 3.3 0 6 2.5 6 6C43 33.6 32 40 32 40z" fill="#fff"/></svg></div>
 <div style="font-size:13px;color:#5f5357">Message bubble with a heart: a warm wish, a message to someone</div>
 <div class="bar"><svg width="42" height="42" viewBox="0 0 64 64"><path d="M32 6c14.4 0 26 10 26 23s-11.6 23-26 23c-3 0-5.8-.4-8.4-1.2L10 58l3.4-11.4C8.8 42.5 6 36.1 6 29 6 16 17.6 6 32 6z" fill="#fff"/><path d="M32 40s-11-6.4-11-13.2c0-3.5 2.7-6 6-6 2.3 0 4 1.3 5 3 1-1.7 2.7-3 5-3 3.3 0 6 2.5 6 6C43 33.6 32 40 32 40z" fill="#a3122f"/></svg><span class="word">wisher<small>.az</small></span></div></div>

 <div class="fav"><svg width="16" height="16" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#a3122f"/><g fill="#fff"><path d="M32 30c-8-12-22-14-22-5 0 7 12 7 22 5z"/><path d="M32 30c8-12 22-14 22-5 0 7-12 7-22 5z"/><path d="M29 31l-9 20 6-2 4 5 2-23z"/><path d="M35 31l9 20-6-2-4 5-2-23z"/><circle cx="32" cy="30" r="5"/></g></svg><svg width="64" height="64" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#a3122f"/><g fill="#fff"><path d="M32 30c-8-12-22-14-22-5 0 7 12 7 22 5z"/><path d="M32 30c8-12 22-14 22-5 0 7-12 7-22 5z"/><path d="M29 31l-9 20 6-2 4 5 2-23z"/><path d="M35 31l9 20-6-2-4 5-2-23z"/><circle cx="32" cy="30" r="5"/></g></svg></div>
 <div style="font-size:13px;color:#5f5357">Ribbon bow: a present, celebration</div>
 <div class="bar"><svg width="42" height="42" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#fff"/><g fill="#a3122f"><path d="M32 30c-8-12-22-14-22-5 0 7 12 7 22 5z"/><path d="M32 30c8-12 22-14 22-5 0 7-12 7-22 5z"/><path d="M29 31l-9 20 6-2 4 5 2-23z"/><path d="M35 31l9 20-6-2-4 5-2-23z"/><circle cx="32" cy="30" r="5"/></g></svg><span class="word">wisher<small>.az</small></span></div></div>
</body></html>
