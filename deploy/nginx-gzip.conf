# Compression for the Next.js proxy. cPanel strips Accept-Encoding upstream, so nginx compresses.
gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml application/manifest+json application/ld+json image/svg+xml;
