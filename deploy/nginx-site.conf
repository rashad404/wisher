# cPanel domain include, matching the Elek proxy pattern.
set $CPANEL_APACHE_PROXY_PASS http://127.0.0.1:3022;
set $CPANEL_SKIP_PROXY_CACHING 1;
if ($host = www.wisher.az) { return 308 https://wisher.az$request_uri; }
if ($scheme = http) { return 308 https://wisher.az$request_uri; }
# Preserve certificate renewal against the untouched legacy docroot.
location ^~ /.well-known/acme-challenge/ { root /home/wisher/public_html; }
location ^~ /.well-known/pki-validation/ { root /home/wisher/public_html; }
location ^~ /.well-known/cpanel-dcv/ { root /home/wisher/public_html; }
