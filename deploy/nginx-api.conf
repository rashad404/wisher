# Private Laravel entry point. No public listener or arbitrary PHP path.
server {
    listen 127.0.0.1:8022;
    server_name localhost;
    client_max_body_size 32k;
    access_log off;
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /home/wisher/v2/current/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /home/wisher/v2/current/backend/public;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_NAME wisher.az;
        fastcgi_pass 127.0.0.1:9022;
        fastcgi_read_timeout 40s;
    }
}
