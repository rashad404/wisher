[global]
pid = /home/wisher/v2/shared/php-fpm.pid
error_log = /home/wisher/v2/shared/php-fpm.log
daemonize = no
[wisher-v2]
listen = 127.0.0.1:9022
listen.allowed_clients = 127.0.0.1
pm = ondemand
pm.max_children = 12
pm.process_idle_timeout = 15s
pm.max_requests = 500
clear_env = yes
catch_workers_output = yes
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /home/wisher/v2/shared/php-errors.log
php_admin_value[memory_limit] = 256M
php_admin_value[session.gc_divisor] = 1000
